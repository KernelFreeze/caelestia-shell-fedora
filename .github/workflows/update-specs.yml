name: Update specs

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-git-specs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.SPEC_UPDATE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check git package specs and push to main
        env:
          SPEC_UPDATE_TOKEN: ${{ secrets.SPEC_UPDATE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_specs.py --push-main

  update-release-specs:
    needs: update-git-specs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.SPEC_UPDATE_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check release specs and open PR
        env:
          SPEC_UPDATE_TOKEN: ${{ secrets.SPEC_UPDATE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_specs.py --create-pr --non-git-only
